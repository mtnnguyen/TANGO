name: Validate TANGO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run JavaScript tests
        run: npm test
      - name: Run data preparation unit tests
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build static demo
        run: npm run build
      - name: Verify anonymized research artifacts are included
        run: test -s dist/public/data/account_summaries.json && test -s dist/public/data/research_findings.json
